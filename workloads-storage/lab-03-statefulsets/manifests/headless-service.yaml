apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app: postgres-statefulset
spec:
  # clusterIP: None -> headless Service, no load-balancing.
  # Required by StatefulSet to generate one stable DNS record per Pod.
  clusterIP: None
  selector:
    app: postgres-statefulset
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432