# Explicit requests and limits, with requests < limits.
# This gives QoS class "Burstable": the Pod is guaranteed its requests
# on the node, and can burst up to its limits if capacity allows,
# but is not as protected as a "Guaranteed" Pod (requests == limits)
# when the node comes under memory pressure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-resources
  namespace: resource-management-lab
  labels:
    app: nginx-with-resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-with-resources
  template:
    metadata:
      labels:
        app: nginx-with-resources
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"