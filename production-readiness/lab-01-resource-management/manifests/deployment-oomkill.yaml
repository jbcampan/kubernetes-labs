# Deliberately provokes an OOMKill: the container tries to allocate
# ~200Mi of memory while its limit is set to 50Mi.
# Kubernetes will kill the process with exit code 137 (SIGKILL, OOM)
# and the container will show "OOMKilled" as its last termination reason,
# then restart per the default RestartPolicy (Always).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-oomkill
  namespace: resource-management-lab
  labels:
    app: stress-oomkill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-oomkill
  template:
    metadata:
      labels:
        app: stress-oomkill
    spec:
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "200M"
            - "--vm-hang"
            - "1"
          resources:
            requests:
              cpu: "50m"
              memory: "20Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"