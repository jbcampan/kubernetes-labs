# Deployment running the official Kubernetes HPA demo image.
# This image exposes an HTTP endpoint that performs CPU-bound work
# (square root calculations) on every request, making it easy to
# generate visible CPU load for HPA testing — unlike a plain nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  labels:
    app: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: hpa-demo
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            # requests.cpu is mandatory: HPA computes usage as a percentage
            # of this value. Without it, the HPA controller cannot function.
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi