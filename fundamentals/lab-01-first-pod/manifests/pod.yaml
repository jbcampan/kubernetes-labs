# A single, bare nginx Pod.
# This is intentionally the simplest possible workload: no Deployment,
# no ReplicaSet, no self-healing. If this Pod is deleted, nothing
# recreates it — that limitation is the whole point of this lab.
apiVersion: v1
kind: Pod
metadata:
  name: first-pod
  labels:
    app: first-pod
    lab: lab-01-first-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"