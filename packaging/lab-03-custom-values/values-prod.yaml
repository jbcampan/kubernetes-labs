# Prod: pinned image tag, higher replica count, tighter resource envelope.
# (In this sandbox it's still deployed on kind — no real prod cluster involved.)
replicaCount: 3

image:
  tag: "1.27.4-alpine3.20"

resources:
  requests:
    cpu: "250m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"